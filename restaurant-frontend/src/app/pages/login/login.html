<section class="login-page">

  <div class="login-card">

    <div class="login-header">

      <p class="small-title">
        WELCOME BACK
      </p>

      <h1>
        Login to <span>Savora</span>
      </h1>

      <p>
        Sign in to manage your reservations and enjoy your Savora experience.
      </p>

    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        >

      </div>

      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
        </div>

      }

      <button
        type="submit"
        [disabled]="loading"
      >

        @if (loading) {
          Logging in...
        } @else {
          Login
        }

      </button>

    </form>

    <div class="signup-link">

      <span>Don't have an account?</span>

      <a routerLink="/signup">
        Create one
      </a>

    </div>

  </div>

</section>
